[package]
# The recorder: clock, capture, encode, mux, and the files a take produces.
#
# WHAT IS NOT HERE IS AS DELIBERATE AS IN `tangent-ui`, but the rule is the
# opposite one. `tangent-ui` exists so that platform things are UNREACHABLE from
# shared GUI code. This crate exists so that platform things have somewhere to
# live that is NOT the GUI: cpal, a camera, an encoder and a file writer all
# belong to a desktop and none of them belong in a VST3 editor.
#
# So: `ivory` depends on this crate; `tangent-ui` and `tangent-core` must NEVER.
# `scripts/check-firewall.sh` asserts that, and see docs/RECORDER-PLAN.md §10
# item 5 for why that assertion needs `--target all` to mean anything.
#
# No egui here either. The recorder produces bytes; drawing them is `tangent-ui`'s
# job and compositing them is `ivory`'s (RECORDER-PLAN §6).
name = "tangent-record"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `default-features = false, features = ["std"]` turns OFF `parallel`, which is
# the only thing that would pull `rayon`. With it off midly has ZERO transitive
# dependencies: one line in Cargo.lock, one Unlicense entry in
# THIRD-PARTY-LICENSES. `parallel` only accelerates PARSING, which a recorder
# never does.
midly = { version = "0.5", default-features = false, features = ["std"] }

# Audio I/O. Apache-2.0. `default = []` upstream, so the ASIO feature stays OFF
# and the Windows backend is WASAPI — which matters because ASIO went the
# OPPOSITE way from VST3 and is now GPLv3-or-proprietary.
cpal = "0.16"

# Lock-free SPSC ring, MIT OR Apache-2.0. The audio callback must never
# allocate, never lock and never touch a file; this is how samples leave it.
rtrb = "0.3"

# **For reading `pw-dump`, and for nothing else.** MIT OR Apache-2.0, pure
# Rust, already built for this workspace by `tangent-ui`'s settings file — so it
# costs no build time and links no system library.
#
# It is here because on a PipeWire machine ALSA cannot enumerate the interfaces
# at all (see `audio::pipewire_sources`), and the alternative was `pipewire-rs`,
# which needs libpipewire's headers at build time. The Linux artifacts are
# cross-compiled from a Mac; that dependency would have traded a working
# release process for a tidier lookup.
serde_json = "1"

# ── the camera, macOS only ──────────────────────────────────────────────────
#
# TARGET-GATED, NOT HOST-GATED, and the distinction is the release. Windows
# builds go through `cargo xwin` FROM a Mac and Linux is cross-compiled too, so
# anything written as a plain `[dependencies]` entry — or gated on a *host*
# condition — would be pulled into the Windows link and fail there. The gate is
# on `target_os`, and `scripts/check-firewall.sh --target all` is where that
# stays true. Verify by hand with:
#
#   cargo tree -p tangent-record --target x86_64-pc-windows-msvc | grep -i objc
#
# Zlib OR Apache-2.0 OR MIT, all four. `default-features = false` matters more
# than usual here: objc2-av-foundation's default feature set is EVERY class in
# AVFoundation (~500 modules, a multi-minute build). The list below is the
# capture pipeline and nothing else.
#
# These are not new to the dependency graph: cpal 0.16 already links
# objc2 0.6, objc2-core-audio, objc2-core-audio-types and objc2-core-foundation
# for its CoreAudio backend, so the camera adds four crates to a tree that was
# already objc2-shaped rather than introducing a second FFI style.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSValue",
] }
# No `block2`: the only AVFoundation entry point that needs it is
# `requestAccessForMediaType:completionHandler:`, and we deliberately do not
# call it. AVFoundation raises the TCC prompt by itself when an
# AVCaptureDeviceInput is created, so the prompt happens at Open Camera — the
# one moment where the user has just asked for a camera and the dialog is not a
# non-sequitur. See `permission_status` in `camera.rs`.
#
# The ENCODER half of this list (`AVAssetWriter`, `AVAssetWriterInput`,
# `AVVideoSettings`) is what turns camera frames into an `.mp4`. It is a handful
# of classes rather than the whole of AVFoundation for the same reason as
# above: the default feature set is ~500 modules and a multi-minute build.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoDataOutput",
    "AVMediaFormat",
    "AVVideoSettings",
    # The window capture: `AVCaptureScreenInput` is generated without a
    # feature, but the two methods that matter on it are not — its
    # initialiser takes a `CGDirectDisplayID` (objc2-core-graphics) and its
    # crop rect a `CGRect` (objc2-core-foundation). Both crates are ALREADY
    # in the binary's tree by way of eframe (arboard, objc2-app-kit), so
    # switching these on changes no licence and adds no crate; it only lets
    # this one see two types it was already linking.
    "objc2-core-foundation",
    "objc2-core-graphics",
    # `AVAudioSettings` is enabled for completeness, but note that the crate
    # generates NOTHING for it: the settings-dictionary keys the AAC input
    # needs (`AVFormatIDKey` and friends) have no bindings, so `encode/macos.rs`
    # links the symbols itself rather than hard-coding their string values.
    "AVAudioSettings",
    "dispatch2",
    "objc2-core-media",
    # Without this the pixel-buffer adaptor has no `pixelBufferPool` and no
    # `appendPixelBuffer:withPresentationTime:` — both are gated on the
    # CoreVideo dep, and their absence reads as "no method named
    # appendPixelBuffer" rather than as a missing feature.
    "objc2-core-video",
] }
# See the note on objc2-av-foundation's features above: both already in the
# tree, neither new to the licence list.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CGDirectDisplay",
    "CGGeometry",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    # Without this, `CMSampleBuffer::image_buffer()` does not exist — the
    # accessor is feature-gated on the CoreVideo dep, and its absence reads as
    # "no method named image_buffer" rather than as a missing feature.
    "objc2-core-video",
    "CMBase",
    # The audio half of a take's video file. `CMBlockBuffer` holds the PCM and
    # `objc2-core-audio-types` is where `AudioStreamBasicDescription` lives —
    # without the latter, `CMAudioFormatDescriptionCreate` and
    # `CMAudioSampleBufferCreateReadyWithPacketDescriptions` are both absent
    # and the absence reads as a missing function rather than a missing
    # feature.
    "CMBlockBuffer",
    "objc2-core-audio-types",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
] }
# Already in the tree via cpal's CoreAudio backend; named here because a
# transitive dependency is not a nameable one.
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "std",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    # The encoder's frames come from the adaptor's own pool rather than being
    # allocated per frame: at 1080p30 that is 250 MB a second of malloc/free
    # that the pool exists to avoid.
    "CVPixelBufferPool",
    "CVReturn",
] }
# The delegate must be handed a SERIAL queue or AVFoundation makes no ordering
# promise about frames (`setSampleBufferDelegate:queue:` documents exactly
# that). `DispatchQueue::new(label, None)` is serial — a null attr is the
# serial attr.
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
] }

# ── the camera, Linux ───────────────────────────────────────────────────────
#
# Target-gated exactly like the macOS block above and for the same reason: the
# Windows build must never see these. `linuxvideo` is the crate
# RECORDER-PLAN §4 names — 0BSD, pure Rust ioctl wrappers, no bindgen, no
# libclang — so the V4L2 backend adds no C toolchain requirement to the build.
[target.'cfg(target_os = "linux")'.dependencies]
# **Vendored, and the patch is the point.** 0.3.5 hardcodes two buffers behind
# a `pub(crate)` constructor and never surfaces `v4l2_buffer.sequence`, so
# upstream we can neither ask for a deeper queue nor SEE the frames a shallow
# one loses. `vendor/linuxvideo` adds `into_stream_with`, `buffer_count` and
# `sequence` and changes nothing else; `vendor/README.md` carries the diff and
# the upstream issue. Drop this back to a registry version once that lands.
linuxvideo = { path = "vendor/linuxvideo" }
# MJPEG. Most UVC webcams offer their full frame rate only compressed — the
# 2012 FaceTime HD this was written against does YUYV at 30 fps up to 640x480
# and needs MJPG for 1280x720 at 30 — so a backend without a JPEG decoder is a
# backend that silently caps most cameras at VGA. Pure Rust,
# MIT/Apache-2.0/Zlib — and 0.5 specifically because eframe already carries
# zune-jpeg 0.5 transitively (image → tiff), so this pins to the version that
# is in the tree anyway rather than adding a second copy of the decoder.
zune-jpeg = "0.5"

# **Linux gets the JACK host too, and it costs the stock desktop NOTHING.**
#
# This was left off for years on one premise, written into `audio::systems()`
# and repeated in the FreeBSD note below: that the `jack` feature "needs a
# development library present at BUILD time" and therefore puts libjack in the
# artifact's `DT_NEEDED`. **That premise is false for `jack` 0.13**, which is
# what cpal 0.16 depends on. `dynamic_loading` is one of that crate's DEFAULT
# features, and it means every libjack call goes through `libloading` at run
# time — so the library is `dlopen`ed on first use and its absence is an
# ordinary `Err`, not a binary that will not start.
#
# What was true is that `jack-sys`'s build script defeated its own feature on
# Linux specifically, by probing pkg-config and emitting a link directive
# anyway. That is the one conditional in `tangent-record/vendor/jack-sys`; see
# its `PATCH.md`. With it, the measured result on the Linux x86_64 artifact is
# that `readelf -d` gains no entry at all.
#
# So the trade the FreeBSD note had to reason about does not exist here. A
# machine with no pro-audio stack installed runs exactly the binary it ran
# before and never opens the library; a machine with JACK — or with PipeWire,
# which ships an ABI-compatible libjack that nearly every desktop Linux now has
# by default — gains the entry in the Audio Setup panel.
#
# **Why it is worth having — and it is NOT, on the evidence so far, latency.**
#
# The reasoning that motivated this was structural and looked airtight: on a
# PipeWire desktop the ALSA host reaches the graph through pipewire-alsa, an
# emulation layer, and carries the four-period ring `BUFFER_PERIODS` had to add
# for it, where a JACK client is in the graph directly on a thread the server
# scheduled. Deleting a stage should beat tuning one.
#
# **It was measured before it was believed, and it did not survive.**
# `docs/LINUX-JACK-FINDINGS.md` has the runs. On the dev box, capture to
# playback through the monitor ring: ALSA 5.6-5.9 ms median, JACK 23.4-26.4 ms.
# JACK is four times worse on the path Tangent actually uses.
#
# Neither number means what it looks like, which is why the doc exists rather
# than a one-line note. **pipewire-alsa reports a PCM delay of ZERO** — cpal's
# ALSA host computes `playback = callback + snd_pcm_status_get_delay`, and that
# addend is 0 on every callback, so the ALSA figure omits the entire output leg
# and cannot be compared with anything. And JACK's figure carries a full extra
# graph cycle that is cpal's doing, not the server's: cpal opens two INDEPENDENT
# clients, `Tangent_in` and `Tangent_out` ("Until we have duplex streams two
# clients will be created", `host/jack/mod.rs`), and nothing orders them, so the
# output client can run before the input client every cycle and the ring between
# them never drains. Settling it needs `rtclick` on a wired loopback, which is
# the instrument this project already keeps for drivers that misreport.
#
# So the case for shipping it is the one that does not need a stopwatch:
#
# - **The interface has a name again.** Through JACK the ports are
#   `Scarlett Solo (3rd Gen.) Pro:capture_AUX0`. Through ALSA on a PipeWire box
#   there is ONE openable PCM, called `pipewire`, which follows whatever the
#   desktop's default source happens to be — the fault that once recorded a
#   laptop microphone with an interface plugged in.
# - **It can be patched.** Tangent appears in qjackctl, Carla or Patchance and
#   can be wired into a DAW, sample-synchronous, which is the whole reason a
#   pro-audio session exists.
# - **It costs nothing to offer.** libjack is `dlopen`ed, so the artifact gains
#   no `DT_NEEDED` entry and no new crate enters the graph — `jack` was already
#   there for FreeBSD. A desktop with no pro-audio stack runs what it ran
#   before.
#
# **It does not become the default.** cpal's `default_host()` on Linux is a
# hardcoded `AlsaHost::new()` whatever features are on. All this does is add
# "JACK" to `cpal::available_hosts()`, which is what `audio::systems()` lists —
# and `audio::build_host` refuses to seat a JACK host that answered with no
# devices, so choosing it on a machine with no server running gives the user
# their sound back rather than silence. Given the measurement, that default is
# now load-bearing rather than merely cautious.
#
# `cargo run --release -p tangent-record --example rtlatency` takes the numbers
# on either host — `SYSTEM=JACK` picks this one, and it now reports the output
# leg on its own, which is the part the two hosts disagree about.
cpal = { version = "0.16", features = ["jack"] }

# **FreeBSD gets the JACK host as well as ALSA, and this does not change the
# default.**
#
# cpal 0.16 already supports FreeBSD properly — `src/platform/mod.rs` and
# `src/host/mod.rs` gate the ALSA host on `linux|dragonfly|freebsd|netbsd`, and
# `Cargo.toml` declares its optional `jack` dependency for that same set — so
# FreeBSD needs no patched cpal, only the feature turned on.
#
# Why turn it on unconditionally here rather than behind our own cargo feature
# like `asio` is: on FreeBSD libjack is ALREADY a hard dependency of the build,
# because midir has no other backend there (see tangent/Cargo.toml). Once the
# library is linked regardless, hiding the audio half of it behind a flag buys
# nothing and costs the user the pro-audio path.
#
# It is safe for the out-of-the-box case, which was the thing worth checking:
# cpal's `default_host()` for this platform is a hardcoded `AlsaHost::new()`
# whatever features are on, so JACK never becomes the default by being present.
# All it does is add "JACK" to `cpal::available_hosts()`, which is precisely
# what `audio::systems()` enumerates into the Audio Setup panel — so the picker
# grows a working JACK entry with no UI code, the same way ASIO does on Windows.
#
# Measured, not assumed: stock GhostBSD with nothing configured plays and
# records through the ALSA host over FreeBSD's alsa-lib-to-OSS shim. JACK is the
# low-latency option on top (`jackd -d oss`), not the thing standing between the
# user and their first sound.
[target.'cfg(target_os = "freebsd")'.dependencies]
cpal = { version = "0.16", features = ["jack"] }
# **The camera, and it is the Linux backend unmodified.**
#
# `webcamd` ports the Linux UVC driver into userspace and exposes it through
# CUSE as `/dev/video*`, so what is behind the node is the same `uvcvideo`
# talking the same V4L2 ABI — `QUERYCAP` on this laptop answers
# `driver="uvcvideo"`. The one thing that could have made the numbers differ is
# the ioctl encoding, since FreeBSD packs the direction in 3 bits over a 13-bit
# size where Linux uses 2 over 14, and `_IOR`/`_IOW` are SWAPPED between them.
# `uoctl` — which is where `linuxvideo`'s constants actually come from — already
# carries `platform/bsd.rs` and cfg-selects it for `target_os = "freebsd"`, so
# the constants come out right with no patch: `VIDIOC_QUERYCAP` compiles to
# 0x40685600 here, which is byte for byte what `truss` shows ffmpeg sending.
#
# So this is the same `vendor/linuxvideo` the Linux block pins, for the same
# reasons, and `camera/linux.rs` is shared rather than copied. See that file for
# the two places FreeBSD diverges (node enumeration, and no VA-API).
linuxvideo = { path = "vendor/linuxvideo" }
# MJPEG, exactly as on Linux — a UVC camera that offers 720p at 30 fps offers it
# compressed, and without a decoder the picker silently caps at VGA. There is no
# VA-API half on FreeBSD, so this is the only decoder here rather than the
# fallback one.
zune-jpeg = "0.5"

[lints]
workspace = true

[features]
# The Steinberg ASIO backend, Windows only in practice. Off by default:
# building it needs the ASIO SDK on disk (CPAL_ASIO_DIR) and the SDK's
# licence accepted — see docs/RELEASE.md.
asio = ["cpal/asio"]
