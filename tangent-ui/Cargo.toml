[package]
# The GUI. MIT, like everything else in this repo.
#
# It exists so that everything that draws is one crate: the binary links it,
# the test suite drives it in a bare egui context, and the compositor paints
# its panels into a video frame, all from the SAME code.
#
# WHAT IS NOT A DEPENDENCY HERE IS THE POINT. No eframe, no midir, no rfd, no
# fd-lock: the window, the MIDI device, the native file dialogs and the
# single-instance lock are the binary's, and so is the process, which nothing
# here may end with `process::exit`. Leaving those out makes all of it
# UNREACHABLE from GUI code rather than merely discouraged, enforced by the
# compiler instead of by review. `scripts/check-firewall.sh` asserts it.
name = "tangent-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `license` MUST be listed: without it tangent-core compiles the no-op
# verification stub and every supporter key is silently rejected while every
# test still passes. The supporter gate itself lives in this crate
# (`TangentApp`'s `LicenseStore`), so a build of it alone, its own tests
# included, has to verify a key the way the binary does;
# `tangent/tests/license_feature.rs` guards the binary's line.
tangent-core = { path = "../tangent-core", features = ["learning", "license"] }
egui = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is load-bearing, not a nicety. Undo and "is there
# anything unsaved?" both lean on `to_json(from_json(x)) == x`; without
# this feature serde_json's fast float parser reads a 17-digit shortest
# repr such as `0.9999999999999999` back as `1.0`, so a document carrying
# one was NOT a fixed point and opened dirty, and an undo across it pushed
# a moment for an edit nobody made. `a_seventeen_digit_float_is_a_fixed_point`
# in arrangement.rs pins it. Upstream calls the exact parser slower; measured
# in release on the perf fixtures it is inside the noise (`from_json` S 355 KB
# 0.92 -> 0.93 ms, M 3.6 MB 11.5 -> 11.3 ms, L 22 MB 69 -> 68 ms), because
# only a decimal the fast path cannot settle takes the slow road, and a real
# document parses in about a millisecond either way.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# **No `dirs`.** Every folder this crate names under a person's home (the
# media root, the old take folder, where the explorer opens) is reached
# through `tangent_core::config`, the one road, so a test build's redirect
# covers it; without the crate here a second road is a compile error rather
# than a review comment (`ban_scan` refuses one in every crate).
log = "0.4"

[dev-dependencies]
ttf-parser = "0.25"
# **This crate's tests never reach a person's files.** `test-home` puts
# `tangent_core::config::home` in a scratch folder for a test build: this
# crate's `cfg(test)` cannot, since it does not reach the tangent-core these
# tests link, which read the real `~/.config/tangent` (the taught chords, for
# every app a test built). A dev-dependency's features reach test builds
# alone (resolver 2), so the binary, which links this crate, never carries
# it; `scripts/check-home.sh features` proves that. `test-keyring` rides the
# same road: the supporter fixture is signed by a test-only key that no
# shipped build accepts.
tangent-core = { path = "../tangent-core", features = ["test-home", "test-keyring"] }

[lints]
workspace = true
