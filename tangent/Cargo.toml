[package]
# What still wears the codename, and why. "Ivory" survives only where
# changing it would cost a user something real: the macOS bundle id
# (Gatekeeper trust and every external binding are keyed to it), the settings
# and override file FORMATS, and the IVORY_* developer switches scripts and
# muscle memory depend on. The crates, the config dir and the app struct are
# all tangent-named now; none of what remains is visible to anyone using the
# app.
name = "tangent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

# The BINARY carries the product name, because users type it, see it in a
# process list, and read it in the Linux tarball.
[[bin]]
name = "tangent"
path = "src/main.rs"

[features]
# Full is the default and the recommended install. `--no-default-features`
# builds Minimal, which cannot open a camera, cannot host a plugin, and does not
# link the code to do either — an exclusion the compiler enforces rather than a
# flag anyone can flip.
#
# NOTE the asymmetry that keeps this honest: `#[cfg(feature = ...)]` is allowed
# HERE and nowhere else. `tangent-ui` has a standing rule against feature cfgs
# (PLUGIN-PLAN §1) because they are the seed of the two-GUI fork the egui 0.33
# pin exists to prevent. The GUI compiles the Recorder band in every build and
# switches it off through `Caps::MINIMAL`, exactly as the plugin already
# switches off everything it cannot do.
default = ["recorder", "mp3"]
# MP3 export via static LAME. Off on the Windows cross build — see the
# dependency note — and the export delivery says so instead of failing.
mp3 = ["dep:mp3lame-encoder"]
# Steinberg ASIO for the Windows build: the industry's low-latency door.
# Needs CPAL_ASIO_DIR pointing at the SDK at build time.
asio = ["cpal/asio", "tangent-record?/asio"]
recorder = ["dep:tangent-record", "dep:tangent-host", "dep:cpal", "dep:rtrb"]

[dependencies]
# The GUI always enables the engine's `learning` feature — the re-ranker is a
# user-facing option now, and it stays inert (adjustment exactly 0.0) until the
# user turns Chord Learning on AND has trained weights. Keeping it a feature of
# tangent-core alone means `cargo test -p tangent-core` still exercises the stock
# engine path, while every packaged binary ships the option.
# `license` MUST be listed here: without it tangent-core compiles the no-op
# verification stub and the shipped app silently rejects every valid key while
# every test still passes. `tests/license_feature.rs` guards this.
tangent-core = { path = "../tangent-core", features = ["learning", "license"] }
# The shared GUI. Everything the plugin will also link lives here; this crate
# keeps only what genuinely belongs to a desktop binary — the window, the MIDI
# device, the single-instance lock, the CLI.
tangent-ui = { path = "../tangent-ui" }
# The recorder and the plugin host. Platform-owning by design, so they live here
# and NEVER in tangent-ui — see docs/RECORDER-PLAN.md §2.
#
# OPTIONAL, and that is the whole Minimal build (§12a). Not because of size:
# measured against the real release profile, midly, cpal and rtrb are +16 KB
# each and vst3 is +0 KB. It is because a Full build must ship
# `disable-library-validation` and `allow-jit` to host plugins at all, plus
# camera and microphone usage strings — and someone who wants a chord display
# should not have to run a binary that can load arbitrary third-party code.
# Minimal ships no entitlements, exactly as 3.0.0 does.
tangent-record = { path = "../tangent-record", optional = true }
tangent-host = { path = "../tangent-host", optional = true }
# The monitor OUTPUT stream (`src/instrument.rs`), which is a different thing
# from `tangent-record`'s input stream and cannot be borrowed from it: cpal's
# `Stream` is `!Send`, so the one that plays the hosted instrument has to be
# built and held right here, on the thread that owns the plugin. Same versions
# `tangent-record` already pins, so neither adds a crate to the lock file.
#
# OPTIONAL, and part of `recorder` for the same reason the other two are: a
# Minimal build has no plugin to monitor and no click to play, and must not link
# an audio backend to prove it.
cpal = { version = "0.16", optional = true }
# The lock-free SPSC rings the output callback uses for MIDI in, rendered audio
# out, and the plugin hot-swap handoff. See `instrument.rs`.
rtrb = { version = "0.3", optional = true }
# Same crate eframe already links; direct dep so modules can `use egui::...`.
egui = { version = "0.33", default-features = false }
# `accesskit` is in eframe's OWN default features and was lost to
# `default-features = false`, which is why the audit found no accesskit
# anywhere in `Cargo.lock`. It is the platform screen-reader bridge —
# NSAccessibility on macOS, UIA on Windows, AT-SPI over D-Bus on Linux — and
# egui feeds it automatically from `Response::widget_info`. See
# `tangent_ui::a11y` for how surfaces made of one `Painter` get a widget to
# attach that to.
eframe = { version = "0.33", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Already in the tree via eframe; taken as a direct dep so the app can install
# a logger and surface the warnings eframe/glutin emit while probing for a GL
# context. Without one those go nowhere and a startup failure reports only the
# LAST thing that broke.
log = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` for the same reason tangent-ui turns it on: the plugin
# build round-trips the settings JSON through DAW project files, and a float
# that reads back one ULP off is a setting that drifts on every save. Cargo
# unifies features per crate, so this is also what any binary that links
# tangent-ui gets; naming it here keeps the intent visible in both places.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# No `dirs` among the dependencies that ship: every road to a person's home
# is `tangent_core::config::home`, which a test build moves to a scratch
# folder (see the dev-dependencies). `ban_scan` refuses a second road.
fd-lock = "4"
# Optional: the LAME C build cannot be CROSS-compiled at all — autoconf tests
# its toolchain by compiling and RUNNING programs, which a macOS host cannot do
# for a Windows or Linux target. Both cross legs therefore build without `mp3`;
# both ship `tangent-ffmpeg`, so MP3 delivery goes through the sidecar and only
# a build with no sidecar at all falls back to WAV with an honest note.
mp3lame-encoder = { version = "0.2.5", optional = true }

[dev-dependencies]
ttf-parser = "0.25"
# **The binary's tests never reach a person's files.** `test-home` puts
# `tangent_core::config::home`, and every config, media, project and take
# folder built on it, in a scratch folder per test process. It has to be a
# feature: `cfg(test)` is per crate, and the tangent-core and tangent-ui
# these tests link are ordinary builds that resolved the owner's real
# `~/.config/tangent`, `Documents/Tangent Media` and `Movies/Tangent`.
# Resolver 2 gives a dev-dependency's features to test builds alone, so
# `cargo build` and every shipped artifact resolve the real home;
# `scripts/check-home.sh features` proves it, and `home_tests` in main.rs
# pins that this test build has it.
tangent-core = { path = "../tangent-core", features = ["test-home"] }
# One `#[ignore]` probe measures what the per-frame home lookups cost before
# they were cached, and that "before" is `dirs::home_dir` itself. Tests only.
dirs = "6"

# No build-dependencies. `build.rs` shells out to whichever resource compiler
# is present rather than taking `winres`, because the dependency has to be
# chosen by the TARGET and cargo selects build-dependencies by the HOST — which
# is why the old `[target.'cfg(windows)'.build-dependencies] winres` never once
# ran for a Windows build cross-compiled from macOS, and why every shipped
# tangent.exe has no icon.

[target.'cfg(windows)'.dependencies]
# `Win32_Storage_FileSystem` is for `GetDiskFreeSpaceExW`: the Recorder band
# reports remaining space as a DURATION rather than as bytes, and there is no
# portable way to ask how much room is left.
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    # TerminateProcess/GetCurrentProcess — the exit that skips every
    # loaded plugin's static destructors; see main's closing comment.
    "Win32_System_Threading",
] }

# **wgpu on every platform, for the video compositor and nothing else.**
#
# The compositor renders an offscreen egui pass into a texture and reads it
# back. It used to be macOS-only because that is where eframe is asked for its
# wgpu renderer, and the compositor borrowed that device. It opens its own now
# when the window has none, so the only thing these platforms were missing was
# the crate, and a whole platform could not film because of it.
#
# The window still draws with glow here. This is a headless device for one
# offscreen pass, so it takes whatever adapter it can find: Vulkan first, and
# GLES for a machine without it.
#
# **Vulkan on Windows and not DX12**, which is not a preference. wgpu-hal's
# dx12 backend goes through `gpu-allocator`, which pins its own `windows`
# crate, and this crate already has one for the Win32 calls in `desktop.rs`.
# Two versions of `windows` in one graph do not share types, and the build
# fails inside wgpu with `expected ID3D12Device, found ID3D12Device`. Vulkan
# has no such dependency and is on every Windows machine with a graphics
# driver from the last decade.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles"] }
egui-wgpu = { version = "0.33", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles"] }
egui-wgpu = { version = "0.33", default-features = false }

# **MIDI in — everywhere midir actually has a backend.**
#
# midir 0.11's backend table (`src/backend/mod.rs`) declares a module for
# windows / macos / ios / linux / wasm / android and NOTHING ELSE. On FreeBSD no
# arm matches, no backend module is declared, every re-export resolves to
# nothing, and the crate fails to compile — which is the wall the first FreeBSD
# tester hit, and not something a `cfg` in our own source can work around.
#
# midir's only OS-agnostic arm is `feature = "jack"`, and the port shipped that
# way first because it built. It was the wrong shape: it made libjack a
# link-time dependency of the whole app and it meant NO KEYBOARD WORKED until
# the user installed JACK and started the server. For a DAW that is a fair ask;
# for a MIDI keyboard monitor it is the product not working out of the box.
#
# So FreeBSD is simply not a midir platform any more. `tangent/src/umidi.rs`
# reads `/dev/umidi*` directly — the native interface, which no Rust crate
# wraps, which is the real reason midir has no arm for it. That leaves JACK as
# a pro-audio *option* (cpal still offers the host) rather than a precondition
# for MIDI existing.
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
midir = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# **Where the cursor is during a FILE DRAG**, which is the one time the
# window toolkit will not say. winit reports `HoveredFile` and no
# `CursorMoved`, so egui has no pointer to offer for the whole drag, and a
# drop had to guess which lane it landed on. Core Graphics answers in global
# display points, which is the same unit egui reports the window's inner rect
# in, so the two subtract cleanly. Already in the tree via wgpu.
core-graphics = "0.23"

# THE macOS RENDERER, and a bug fix rather than a preference.
#
# With a VST3 editor open the main window flickered rapidly, recovering the
# instant the plugin's window closed. eframe draws with glow — OpenGL — and a
# plugin editor on macOS commonly makes its own GL context current on the very
# thread eframe draws from; two GL contexts on one thread is the classic way a
# host ends up drawing into the wrong drawable. Confirmed by switching
# renderers with nothing else changed: under Metal the flicker is gone.
#
# `glow` is still compiled in and `IVORY_RENDERER=glow` selects it, because it
# is what every shipped build until now has used.
#
# macOS-only deliberately: Windows and Linux have no plugin editor yet, so no
# foreign GL context is ever created there, and wgpu is a large tree to put in
# those artifacts for a problem they do not have.
#
# The explicit `wgpu` line is not redundant. eframe is taken with
# `default-features = false`, so enabling its `wgpu` feature alone compiles
# wgpu with NO BACKEND — the app then panics at startup with "No wgpu backend
# feature that is implemented for the target platform was enabled", which is
# what happened the first time. The backend has to be asked for by name.
eframe = { version = "0.33", default-features = false, features = ["wgpu"] }
wgpu = { version = "27", default-features = false, features = ["metal"] }
# The video compositor renders an OFFSCREEN egui pass into a texture it then
# reads back and encodes. That is this crate's job, not `tangent-ui`'s: the
# firewall forbids `tangent-ui` from seeing a renderer at all, which is why the
# seam is `TangentApp::paint_composite(&self, painter, rect, shows)` — a pure
# `egui::Painter` on one side, wgpu on the other.
#
# Not a new dependency: eframe's `wgpu` feature already puts this exact version
# in the lock file. Named here because a transitive dependency is not a
# nameable one.
#
# macOS-only because the renderer is. RECORDER-PLAN §6 specified `egui_glow`
# and borrowing `eframe::Frame::gl()`, which no longer exists on this platform:
# the plugin-editor flicker fix made Metal the default renderer, and under wgpu
# `Frame::gl()` returns None. Re-introducing a second GL context to satisfy the
# old plan would re-introduce the flicker it was written before.
#
# **`macos-window-resize-jitter-fix` is why this line names a feature.** It is
# in egui-wgpu's own DEFAULT set and this build turned defaults off to keep the
# renderer honest, so it has been absent from every macOS build — and it is the
# feature whose entire job is to stop the surface being presented at the old
# size for a frame while an edge is dragged. That is one of the two independent
# causes of a resize that stretches and lurches instead of tracking the hand.
# It needs nothing but `wgpu/metal`, which is already on the line above.
egui-wgpu = { version = "0.33", default-features = false, features = [
    "macos-window-resize-jitter-fix",
] }

# **The one AppKit fact winit will not tell us, and the one hook it does not
# install.** `-[NSWindow inLiveResize]` distinguishes a hand on our own edge
# from a tiling window manager placing us — a difference nothing in egui or
# winit exposes, and the difference between correcting a drag and fighting a
# tiler. `windowWillResize:toSize:` then lets the OS apply this layout's
# aspect DURING the drag instead of the app teleporting the window after it.
#
# Not new crates: tangent-host already puts these exact versions in the lock
# file. Named here because a transitive dependency is not a nameable one.
#
# **UNCONDITIONAL, not behind `recorder`.** The Minimal build
# (`cargo check -p tangent --no-default-features`) compiles `macwin` too, and
# tangent-host is optional, so a feature-gated dependency here breaks that
# build, which `scripts/check.sh`, the release gate, checks.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSEvent",
    "NSResponder",
    "NSView",
    "NSWindow",
    # Borderless + maximised has to reach the SCREEN it is on and the
    # presentation options that own the menu bar and the Dock. See
    # `macwin::cover_screen`.
    "NSScreen",
    "NSApplication",
    "NSRunningApplication",
    # `NSWorkspace.isVoiceOverEnabled` — the one honest way to ask macOS
    # whether a reader is actually running, so the app can bring its dialogs
    # inline for a VoiceOver user without guessing. The method lives in the
    # NSAccessibility module's `impl NSWorkspace`, so it takes BOTH features.
    # See `desktop::os_reader_attached`. Costs compile time only: the two
    # features pull nothing but objc2-foundation sub-features already here.
    "NSAccessibility",
    "NSWorkspace",
    # `-[NSWindow addChildWindow:ordered:]` and `orderWindow:relativeTo:` both
    # take an `NSWindowOrderingMode`, which lives in the NSGraphics module —
    # so keeping a face above the MAIN window rather than above every program
    # on the machine takes this feature. See `macwin::adopt_floating`. Costs
    # nothing but compile time: it pulls only objc2-foundation sub-features
    # already in the tree.
    "NSGraphics",
    # **The save panel is an OPEN panel on macOS.** `NSSavePanel` refuses any
    # folder under ~/Documents on the owner's machine and opens at home; the
    # open panel honours the same folder. So `macwin::save_panel` builds one
    # in choose-a-folder mode with a name field in its accessory view, and
    # a delegate that refuses an empty or taken name. Measured with
    # `tools/panelprobe`; the story is in `tangent/vendor/README.md`.
    "NSOpenPanel",
    "NSSavePanel",
    "NSPanel",
    "NSAccessibilityProtocols",
    "NSTextField",
    "NSControl",
    "block2",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    # For the save panel above: the folder as an `NSURL`, the name as an
    # `NSString`, and the refusal as an `NSError` with a description.
    "NSString",
    "NSURL",
    "NSError",
    "NSDictionary",
    # `NSProcessInfo`, for two things the OS will not tell us any other way:
    # which macOS this is (the log header), and that this process is doing
    # latency-critical work (`macwin::hold_latency_critical`). Bindings only —
    # this adds no crate to the tree and no line to THIRD-PARTY-LICENSES.
    "NSProcessInfo",
] }
# The completion block `beginSheetModalForWindow:` takes. Already in the lock
# at 0.6.2 through rfd; named here because a transitive dependency is not a
# nameable one. See `macwin::save_panel`.
block2 = "0.6"
# eframe does NOT re-export this, and the trait has to be nameable to be used.
# Already in the lock at 0.6.2, the same copy eframe itself resolves.
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
# `statvfs`, the other half of the same question. Already in the tree via cpal;
# named here because a transitive dependency is not a nameable one.
libc = "0.2"


[lints]
workspace = true
