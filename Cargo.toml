[workspace]
members = ["tangent-core", "tangent-ui", "tangent", "tangent-record", "tangent-host"]
# `tangent-record/vendor/linuxvideo` is a patched copy of a crates.io crate, not
# a crate of ours. A path dependency living inside the workspace directory has
# to be either a member or excluded, and excluded is what it should be: it must
# stay byte-comparable to upstream 0.3.5, which means no workspace lints and no
# `cargo test --workspace` opinions about someone else's code.
exclude = ["tangent-record/vendor/linuxvideo", "tangent-record/vendor/cpal", "tangent-record/vendor/jack-sys", "tangent-host/vendor/lv2-sys", "tangent-host/vendor/lilv", "tangent-host/vendor/livi"]
resolver = "2"

# **A patched cpal, for one host that upstream does not have.**
#
# `tangent-record/vendor/cpal` is cpal 0.16.0 with an OSS host added — FreeBSD's
# native audio interface, which cpal reaches only through the `audio/alsa-lib`
# shim. That shim costs about 16 ms of round trip that no setting recovers
# (`docs/FREEBSD-5.0-FINDINGS.md` §7 has the measurements), and speaking OSS
# directly is the only way past it.
#
# THIS APPLIES TO EVERY PLATFORM, WHICH IS WHY THE PATCH IS SHAPED THE WAY IT IS.
# `[patch.crates-io]` is not target-conditional, so macOS, Windows and Linux
# builds compile this copy too. Everything added is behind
# `#[cfg(target_os = "freebsd")]`, so those platforms compile byte-identical
# code to upstream 0.16.0 and get an identical binary.
# `tangent-record/vendor/README.md` carries the diff, the measurements and the
# upstream issue; keep it that way, because the moment this copy diverges
# anywhere outside a freebsd cfg it stops being a patch and starts being a fork
# of everybody's audio.
[patch.crates-io]
cpal = { path = "tangent-record/vendor/cpal" }
# **One line of difference, for a crate that refuses to build otherwise.**
# `lv2-sys` selects pre-generated bindings with a cfg_attr table covering linux
# and windows, and `compile_error!`s on anything else — so no LV2 host can exist
# on FreeBSD without this. Its `src/linux/` is a pure architecture dispatch with
# no Linux-specific content, so the freebsd arm points at the same file.
# `tangent-host/vendor/README.md` has the detail. Upstream-able as written.
lv2-sys = { path = "tangent-host/vendor/lv2-sys" }
# **Two lines, so the aarch64 Linux artifact exists at all.** `lilv` 0.2.4
# declares two `ui.rs` parameters `*const i8`, and `c_char` is UNSIGNED on
# aarch64 — so it builds on x86_64 and fails on arm64 with three type errors
# that look like a toolchain fault. `tangent-host/vendor/lilv/PATCH.md` has
# the detail. Inert on macOS and Windows, which never pull `lilv` at all.
lilv = { path = "tangent-host/vendor/lilv" }
# The same two-line class of fix one crate up the LV2 stack — six `i8`s that
# have to be `c_char`. `tangent-host/vendor/livi/PATCH.md` has the detail.
livi = { path = "tangent-host/vendor/livi" }
# **One conditional, so the Linux binary can offer JACK without REQUIRING it.**
# `jack-sys` 0.5.1 probes pkg-config for libjack and `unwrap()`s the result on
# Linux — even under `dynamic_loading`, the default feature that exists
# precisely so libjack is `dlopen`ed at run time instead of linked. The probe
# emits `cargo:rustc-link-lib=jack` when it succeeds, so a build host with jack
# development files installed would silently produce an artifact that will not
# START on a desktop without libjack. `tangent-record/vendor/jack-sys/PATCH.md`
# has the detail. Inert on macOS and Windows, which never pull `jack-sys`, and
# inert with `dynamic_loading` off.
jack-sys = { path = "tangent-record/vendor/jack-sys" }

[workspace.package]
version = "5.0.0-dev"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
strip = true

# Shared lint policy. Deliberately narrow: broad groups (clippy::all,
# clippy::pedantic) are NOT enabled — the scoring ladder in detector.rs trips
# ~14 style lints whose "fixes" would churn frozen, differential-locked code.
#
# The numbers below were MEASURED 2026-08-31 on 5.0.0-dev with the pinned
# toolchain (1.97.1 — see rust-toolchain.toml). They are a snapshot, not a
# promise: re-measure whenever that pin bumps, and date the result here.
#
#   cargo build --workspace: 694 warnings — 521 unnecessary_qualifications
#   (our own lint below firing on a backlog, not a policy failure; do NOT
#   `cargo fix` it in one sweep, that is a 500-site churn diff through frozen
#   files), 91 falling-back-to-f32 inference, 40 dead_code (inventoried by
#   audit item W62), rest misc and deprecations.
#
#   cargo clippy --workspace: DOES NOT COMPLETE — two deny-by-default errors:
#   absurd_extreme_comparisons at the DRUM_PAD_BASE guard in
#   tangent-ui/src/app.rs (the base is 0 today; the >= guard is there for a
#   nonzero future), and derived_hash_with_manual_eq in the vendored
#   linuxvideo copy, which must stay byte-comparable to upstream — clippy
#   around it with --exclude rather than fixing someone else's crate.
#
# Verified-red at the same measurement and intentionally omitted:
# clippy::unwrap_used (242 in src/ — tangent-record 95, tangent-ui 94,
# tangent-core 31, tangent 11, tangent-host 11; 285 counting tests and
# examples), clippy::indexing_slicing, clippy::print_stdout,
# clippy::expect_used, clippy::exit, clippy::mem_forget, unreachable_pub,
# let_underscore_drop.
[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2018_idioms = "warn"
unused = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
semicolon_if_nothing_returned = "warn"
lossy_float_literal = "warn"
verbose_file_reads = "warn"
