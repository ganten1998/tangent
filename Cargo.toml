[workspace]
members = ["tangent-core", "tangent-ui", "tangent", "tangent-record", "tangent-host"]
# `tangent-record/vendor/linuxvideo` is a patched copy of a crates.io crate, not
# a crate of ours. A path dependency living inside the workspace directory has
# to be either a member or excluded, and excluded is what it should be: it must
# stay byte-comparable to upstream 0.3.5, which means no workspace lints and no
# `cargo test --workspace` opinions about someone else's code.
exclude = ["tangent-record/vendor/linuxvideo", "tangent-record/vendor/cpal", "tangent-record/vendor/jack-sys", "tangent-record/vendor/asio-sys", "tangent-host/vendor/lv2-sys", "tangent-host/vendor/lilv", "tangent-host/vendor/livi"]
resolver = "2"

# **A patched cpal, for one host that upstream does not have.**
#
# `tangent-record/vendor/cpal` is cpal 0.16.0 with an OSS host added — FreeBSD's
# native audio interface, which cpal reaches only through the `audio/alsa-lib`
# shim. That shim costs about 16 ms of round trip that no setting recovers
# (`docs/FREEBSD-5.0-FINDINGS.md` §7 has the measurements), and speaking OSS
# directly is the only way past it.
#
# THIS APPLIES TO EVERY PLATFORM, WHICH IS WHY THE PATCH IS SHAPED THE WAY IT IS.
# `[patch.crates-io]` is not target-conditional, so every build compiles this
# copy, and everything it changes (apart from one lint attribute that emits no
# code) is behind a cfg: the OSS host behind `target_os = "freebsd"`; two JACK
# fixes behind the `jack` feature, which Linux and FreeBSD turn on; one ALSA
# fix in the ALSA host (Linux and FreeBSD); and one ASIO fix behind
# `all(windows, feature = "asio")`, which every Windows build we ship has. So
# macOS compiles byte-identical code to upstream 0.16.0 and gets an identical
# binary; Linux, FreeBSD and the shipped Windows build carry the changes
# `tangent-record/vendor/README.md` lists. Keep it that way: the moment this
# copy diverges where no cfg opts in, it stops being a patch and starts being a
# fork of everybody's audio.
[patch.crates-io]
cpal = { path = "tangent-record/vendor/cpal" }
# **One ASIO driver guard for the whole process.** asio-sys 0.2.6 keeps its
# "which driver is loaded" guard inside each `Asio` value, while the SDK it
# wraps keeps the driver itself in process globals — so a second instance on
# a second thread tears down the first one's driver, and the first one, mid
# `ASIOInit`, reads a null back and dies. The crash the Windows tester hit on
# 2026-09-05, symbolised; the guard is a `static` now. One block of
# difference, in `src/bindings/mod.rs`; see `tangent-record/vendor/README.md`.
asio-sys = { path = "tangent-record/vendor/asio-sys" }
# **The save panel opened at HOME however real the directory it was given.**
#
# rfd 0.15.4's macOS `set_path` appends the suggested FILE NAME to the
# starting directory and hands the result to `setDirectoryURL:` claiming it is
# a directory. It is not — it is where the file is about to be written — so
# AppKit discards the URL and the panel falls back to whatever NSSavePanel
# last remembered. One line removed; the name field is still filled, by the
# `set_file_name` call two lines below it. See `tangent/vendor/README.md`.
rfd = { path = "tangent/vendor/rfd" }
# **One line of difference, for a crate that refuses to build otherwise.**
# `lv2-sys` selects pre-generated bindings with a cfg_attr table covering linux
# and windows, and `compile_error!`s on anything else — so no LV2 host can exist
# on FreeBSD without this. Its `src/linux/` is a pure architecture dispatch with
# no Linux-specific content, so the freebsd arm points at the same file.
# `tangent-host/vendor/README.md` has the detail. Upstream-able as written.
lv2-sys = { path = "tangent-host/vendor/lv2-sys" }
# **Two lines, so the aarch64 Linux artifact exists at all.** `lilv` 0.2.4
# declares two `ui.rs` parameters `*const i8`, and `c_char` is UNSIGNED on
# aarch64 — so it builds on x86_64 and fails on arm64 with three type errors
# that look like a toolchain fault. `tangent-host/vendor/lilv/PATCH.md` has
# the detail. Inert on macOS and Windows, which never pull `lilv` at all.
lilv = { path = "tangent-host/vendor/lilv" }
# The same two-line class of fix one crate up the LV2 stack — six `i8`s that
# have to be `c_char`. `tangent-host/vendor/livi/PATCH.md` has the detail.
livi = { path = "tangent-host/vendor/livi" }
# **One conditional, so the Linux binary can offer JACK without REQUIRING it.**
# `jack-sys` 0.5.1 probes pkg-config for libjack and `unwrap()`s the result on
# Linux — even under `dynamic_loading`, the default feature that exists
# precisely so libjack is `dlopen`ed at run time instead of linked. The probe
# emits `cargo:rustc-link-lib=jack` when it succeeds, so a build host with jack
# development files installed would silently produce an artifact that will not
# START on a desktop without libjack. `tangent-record/vendor/jack-sys/PATCH.md`
# has the detail. Inert on macOS and Windows, which never pull `jack-sys`, and
# inert with `dynamic_loading` off.
jack-sys = { path = "tangent-record/vendor/jack-sys" }

[workspace.package]
version = "5.2.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
strip = true

# Shared lint policy. Deliberately narrow: broad groups (clippy::all,
# clippy::pedantic) are NOT enabled — the scoring ladder in detector.rs trips
# ~14 style lints whose "fixes" would churn frozen, differential-locked code.
#
# **The policy is enforced, and the count is zero.**
#
# Measured 2026-09-08 on 5.0.0-dev with the pinned toolchain (1.97.1 — see
# rust-toolchain.toml). `scripts/check.sh` runs the clippy driver over OUR five
# packages with `-D warnings`, and release.sh will not cut a release unless it
# passes. So the number below is not a snapshot of a backlog; it is the number
# the gate holds it to.
#
#   our five packages: 0 warnings.
#
# It was about 1,580 for months, and the comment that stood here said not to
# sweep them because it would be a large churn diff through frozen files. That
# reasoning missed two things. The gate release.sh depends on cannot be green
# while they stand, so the backlog was never neutral — it was what stopped a
# release. And a wall of warnings is where a NEW warning goes to hide: this
# codebase has twice shipped a test that had silently stopped testing, which is
# the same failure with a different alarm. The owner weighed it on 2026-09-08
# and reversed it.
#
# 1,417 of them were rustc's own machine-applicable fixes, applied per category
# and verified per category — see .git-blame-ignore-revs, which git blame reads
# so those commits do not bury the history of the lines they touched. The rest
# were decided one at a time: dead code deleted where it was dead, and kept
# under a NARROW `#[allow]` with a written reason where it was not. Two of
# those reasons turned out to name a reader that did not exist, which review
# caught; a false reason is worse than no allow at all.
#
# **Keeping it at zero.** Fix the warning. `#[allow]` on the single item with a
# doc line saying why is the honest second answer. Widening this table, or
# allowing at module or crate level, is not — that is how 1,580 happened.
#
# Verified-red at the same measurement and deliberately NOT enabled, because
# each is a project rather than a chore: clippy::unwrap_used (242 in src/),
# clippy::indexing_slicing, clippy::print_stdout, clippy::expect_used,
# clippy::exit, clippy::mem_forget, unreachable_pub, let_underscore_drop.
[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2018_idioms = "warn"
unused = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
semicolon_if_nothing_returned = "warn"
lossy_float_literal = "warn"
verbose_file_reads = "warn"
