[package]
name = "tangent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
learning = []
# Offline supporter-license verification. `default-features = false` drops
# `random`/`std`, so this adds no entropy source, no clock and no socket.
license = ["dep:ed25519-compact"]
# **Every home path in a scratch folder: test builds only.** `config::home`
# (and the config directory, the documents and the video folders built on
# it) answers `<temp>/tangent-test-home-<pid>` instead of the person's home.
# Only this crate's unit tests get that from `cfg(test)`, which is true while
# the library itself compiles as a test and in no other build of it: its
# integration tests (`tests/*.rs`) and every other crate's tests link the
# ordinary library, and get it only from this feature. The binary,
# tangent-ui and this crate (for those integration tests, below) turn it on
# from their `[dev-dependencies]` and from nowhere else: resolver 2 gives a
# dev-dependency's features to a test build alone, so `cargo build` (and
# every shipped artifact) resolves the real home. `scripts/check-home.sh
# features` proves that; never name it in a `[dependencies]` line or a
# feature of a crate that ships.
test-home = []
# **The test keyring: test builds only.** Adds `license::test_keyring`'s
# public key (its seed is in the source, deliberately) to the keys
# `verify_key` accepts, so the suites install keys no real signing key ever
# made. Same road as `test-home`: only `[dev-dependencies]` lines turn it
# on, and `scripts/check-home.sh features` proves no shipped build carries
# it. It does NOT imply `license`: a test build still has to get that from
# the ordinary dependency line, which `tangent/tests/license_feature.rs`
# guards.
test-keyring = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ed25519-compact = { version = "2.3", default-features = false, features = ["opt_size"], optional = true }

[dev-dependencies]
# **This crate's integration tests never reach a person's files.** A file in
# `tests/` links this library built without `cfg(test)`, so with nothing
# else asking for `test-home` (as nothing does under check.sh's two `cargo
# test -p tangent-core` legs; a workspace run unified the binary's line in,
# which hid it) `config::home`, `dir`, `file` and `purge_pre_5_0` were the
# real ones there. Naming the crate itself turns the feature on for this
# crate's test builds alone, the same road the binary and tangent-ui take;
# dev edges are never followed for a crate that is somebody's dependency, so
# no build that links this one sees it. `tests/test_home.rs` pins it, and
# `scripts/check-home.sh features` reads it. `test-keyring` the same way, for
# `tests/license_fixtures.rs`.
tangent-core = { path = ".", features = ["test-home", "test-keyring"] }

[lints]
workspace = true
